name: Validate data

on:
  push:
    paths: ["data/**", "pipeline/**", "datapackage.json", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "pipeline/**", "datapackage.json"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Check indexes are up to date
        run: |
          python -m pipeline.run --build-only
          git diff --exit-code -- data/datasets.json data/published/indicators/index.json datapackage.json \
            || (echo "::error::Indexes are stale. Run: python -m pipeline.run --build-only" && exit 1)
      - run: python -m pipeline.validate
